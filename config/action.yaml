# yaml-language-server: $schema=ignore
approach:
  description: "Move to target location"
  type: "navigation"
  framework: "Nav2"
  parameters:
    goal_tolerance: 0.5
    max_velocity: 0.5
    timeout: 60

observe:
  description: "Rotate towards target (in place)"
  type: "rotation"
  framework: "Base controller"
  parameters:
    angle_tolerance: 0.087
    max_angular_velocity: 0.5
    timeout: 10

search:
  description: "Search for target using vision while rotating and visiting patrol points"
  type: "navigation + rotation"
  framework: "Nav2 + Vision feedback"
  parameters:
    timeout: 45
    scan_duration_sec: 4.0
    angular_speed: 0.35
    detection_topic: "/vision/detections"
    cmd_vel_topic: "/cmd_vel"

feed:
  description: "Deliver food item to pet target"
  type: "task"
  framework: "Python"
  parameters:
    item: "apple"

follow:
  description: "Track moving target at safe distance"
  type: "tracking"
  framework: "Nav2 + Vision feedback"
  parameters:
    desired_distance: 1.0
    max_velocity: 0.25
    update_rate: 10
    target_lost_timeout: 3
    detection_topic: "/vision/detections"
    cmd_vel_topic: "/cmd_vel"
    desired_bbox_height_px: 190.0
    max_angular_velocity: 0.45

wait:
  description: "Wait for specified duration"
  type: "control"
  framework: "Python"
  parameters:
    duration_sec: 3.0

report:
  description: "Report current status or sequence result"
  type: "logging"
  framework: "Python"
  parameters:
    message: "sequence completed"
