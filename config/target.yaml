# Static objects: bed, apple, vase, chair, cat
# Dynamic objects: person, dog
# Note:
# Each *_zone is an approach point near the object,
# not the exact object center pose.
# The robot starts near (0, 0), so each target is slightly pulled
# toward the center to avoid collision with the object.

targets:
  ball_zone:
    frame_id: "map"
    x: 0.47
    y: -0.60
    yaw: 0.0
    description: "Ball approach point - inactive unless ball model is included in world"

  apple_zone:
    frame_id: "map"
    x: 0.0
    y: -1.65
    yaw: -1.5708
    description: "Apple approach point"

  bed_zone:
    frame_id: "map"
    x: -1.35
    y: 0.95
    yaw: 2.5269
    description: "Bed approach point"

  chair_zone:
    frame_id: "map"
    x: 0.2824
    y: 1.9152
    yaw: 1.4244
    description: "Chair approach viewpoint, kept about 0.8 m from the adjusted chair center"

  cat_zone:
    frame_id: "map"
    x: 1.44
    y: -1.08
    yaw: -0.6435
    description: "Cat approach point"

  vase_zone:
    frame_id: "map"
    x: 0.08
    y: 1.85
    yaw: 1.5273
    description: "Vase approach point"

  safe_observe_zone:
    frame_id: "map"
    x: 1.55
    y: 0.70
    yaw: 0.4229
    description: "Safe observation point near dog/person area"

# Dynamic targets such as dog/person are detected by vision.
# They should not be approached through target.yaml unless fixed demo zones are intentionally added.

object_centers:
  apple:
    frame_id: "map"
    x: 0.0
    y: -2.20
    yaw: 0.0
    description: "Gazebo apple model center used by face_target"

  bed:
    frame_id: "map"
    x: -2.40
    y: 1.70
    yaw: 3.1416
    description: "Gazebo bed model center used by face_target"

  chair:
    frame_id: "map"
    x: 0.3991
    y: 2.7067
    yaw: -0.0032
    description: "Gazebo chair model center used by face_target"

  cat:
    frame_id: "map"
    x: 1.80
    y: -1.35
    yaw: -1.5708
    description: "Gazebo cat model center used by face_target"

  vase:
    frame_id: "map"
    x: 1.75
    y: 1.35
    yaw: 2.3562
    description: "Gazebo vase model center used by face_target"
